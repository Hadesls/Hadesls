<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Hadesr — Obsidian plugins, tools and automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0e1530"/>
      <stop offset="1" stop-color="#1a1233"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="40" r="240" fill="url(#glow1)"/>
  <circle cx="1110" cy="280" r="190" fill="url(#glow2)"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="78" y="142" fill="url(#name)" font-size="76" font-weight="800" letter-spacing="-2">Hadesr</text>
    <text x="82" y="190" fill="#a5b4fc" font-size="23" font-weight="500">Obsidian plugins · tools · automation</text>
    <rect x="82" y="218" width="112" height="4" rx="2" fill="url(#line)"/>

    <g font-size="17" font-weight="600" fill="#dbeafe">
      <rect x="846" y="70" width="232" height="42" rx="21" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="870" cy="91" r="4" fill="#a78bfa"/>
      <text x="886" y="97">MD Base64</text>

      <rect x="846" y="124" width="232" height="42" rx="21" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="870" cy="145" r="4" fill="#22d3ee"/>
      <text x="886" y="151">WebDAV nas</text>

      <rect x="846" y="178" width="232" height="42" rx="21" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="870" cy="199" r="4" fill="#f472b6"/>
      <text x="886" y="205">Hadesr AI</text>
    </g>

    <text x="78" y="264" fill="#64748b" font-size="14" font-weight="500" letter-spacing="0.4">github.com/Hadesls</text>
  </g>
</svg>
