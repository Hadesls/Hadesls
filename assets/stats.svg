<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="4 Obsidian plugins, 2 community listings, 7 public repositories">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0e1530"/>
      <stop offset="1" stop-color="#1a1233"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid2" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="220" rx="28" fill="url(#bg2)"/>
  <rect width="1200" height="220" rx="28" fill="url(#grid2)"/>
  <circle cx="1080" cy="20" r="180" fill="url(#glow3)"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="52" fill="#64748b" font-size="13" font-weight="700" letter-spacing="2">BY THE NUMBERS</text>

    <text x="72" y="126" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-1">04</text>
    <text x="72" y="162" fill="#94a3b8" font-size="17" font-weight="500">Obsidian plugins</text>

    <line x1="430" y1="58" x2="430" y2="170" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="472" y="126" fill="#c4b5fd" font-size="62" font-weight="800" letter-spacing="-1">02</text>
    <text x="472" y="162" fill="#94a3b8" font-size="17" font-weight="500">Community listings</text>

    <line x1="830" y1="58" x2="830" y2="170" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="872" y="126" fill="#67e8f9" font-size="62" font-weight="800" letter-spacing="-1">07</text>
    <text x="872" y="162" fill="#94a3b8" font-size="17" font-weight="500">Public repositories</text>

    <rect x="72" y="184" width="104" height="3" rx="1.5" fill="url(#accent2)"/>
